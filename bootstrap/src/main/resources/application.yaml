server:
  port: 18080

spring:
  application:
    name: my-agent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/myagent?client_encoding=UTF8
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: MyAgentHikariPool
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: myagent-producer
    send-message-timeout: 3000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  # 使用无状态 JWT；生产环境必须通过环境变量注入独立的高强度密钥。
  token-style: jwt
  token-prefix: Bearer
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:myagent-local-development-jwt-secret-change-in-production-2026}
  is-log: false
  is-print: false

myagent:
  engine:
    type: agent
  enterprise:
    # LOCAL 适合当前开发演示；HTTP_ERP 仅在配置了受控 ERP 地址和服务令牌后启用。
    adapter: ${ENTERPRISE_ADAPTER:LOCAL}
    erp:
      base-url: ${ERP_BASE_URL:}
      service-token: ${ERP_SERVICE_TOKEN:}
      timeout-ms: ${ERP_TIMEOUT_MS:3000}

agent:
  chat:
    provider: siliconflow
    model: deepseek-ai/DeepSeek-V3
  max-iters: 10
  max-retries: 2
  sse-timeout-ms: 900000
  memory:
    enabled: true
    tool-result:
      trigger-chars: 20000
      keep-recent-cycles: 2
      clear-at-least-ratio: 0.2
      evictable-tools: [ search_knowledge ]

ai:
  providers:
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        embedding: /compatible-mode/v1/embeddings
  chat:
    provider: siliconflow
    model: deepseek-ai/DeepSeek-V3
    temperature: 0.3
    max-tokens: 1024
    candidates:
      - id: deepseek-v3
        provider: siliconflow
        model: deepseek-ai/DeepSeek-V3
      - id: deepseek-r1
        provider: siliconflow
        model: deepseek-ai/DeepSeek-R1
        supports-thinking: true
    default-tier: standard
    deep-thinking-tier: deep
    tiers:
      fast:
        candidates: [ deepseek-v3 ]
        timeout-ms: 30000
      standard:
        candidates: [ deepseek-v3 ]
        timeout-ms: 120000
      deep:
        candidates: [ deepseek-r1 ]
        timeout-ms: 180000
  embedding:
    provider: siliconflow
    model: BAAI/bge-m3
    default-model: bge-m3
    dimension: ${rag.default.dimension}
    candidates:
      - id: bge-m3
        provider: siliconflow
        model: BAAI/bge-m3
        dimension: ${rag.default.dimension}
        priority: 1
        enabled: true
      - id: text-embedding-v4
        provider: bailian
        model: text-embedding-v4
        dimension: ${rag.default.dimension}
        priority: 2
        enabled: true
  rerank:
    default-model: noop-rerank
    candidates:
      - id: noop-rerank
        provider: noop
        model: noop
        priority: 100

rag:
  storage:
    type: s3
    kb-bucket: myagent-sources
    asset-bucket: myagent-assets
    s3:
      endpoint: http://127.0.0.1:9000
      access-key: rustfsadmin
      secret-key: rustfsadmin
      region: us-east-1
      path-style: true
  vector:
    type: pg
  keyword:
    type: none
  graph:
    type: none
  default:
    collection-name: myagent_default_store
    dimension: 1024
    metric-type: COSINE
  query-rewrite:
    enabled: true
  rerank:
    enabled: true
  search:
    default-top-k: 10
    recall-budget: 20
    scope:
      min-intent-score: 0.4
      confidence-threshold: 0.6
      supplement-ratio: 0.25
    channels:
      timeout-ms: 15000
      vector:
        enabled: true
      keyword:
        enabled: false
      graph:
        enabled: false
      web-search:
        enabled: false
        count: 5
        timeout-seconds: 10
        api-key: ${YDC_API_KEY:}
    fusion:
      strategy: rrf
      rrf-k: 20
      rerank-candidate-limit: 40
      channel-weights:
        vector: 1.0
        keyword: 1.0
        graph: 0.8
        web-search: 0.5
    evidence:
      min-rerank-score: 0.2
  semaphore:
    document-upload:
      name: myagent:document:upload
      max-concurrent: 10
      max-wait-seconds: 30
      lease-seconds: 30

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.myagent: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
