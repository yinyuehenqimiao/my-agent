# 本地演示中间件。生产环境请自行替换镜像、密码、网络与持久化策略。
# 启动：在仓库根目录执行
#   docker compose -f deploy/docker-compose.yml up -d
# 默认演示口令（仅本地）：
#   PostgreSQL postgres/postgres
#   Redis 密码 redispass
#   MinIO minioadmin/minioadmin
# 请把相同值填进仓库根目录 .env，切勿把真实生产密钥写进本文件。

name: my-agent-middleware

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: myagent
    ports:
      - "5432:5432"
    volumes:
      - myagent_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redispass}"]
    ports:
      - "6379:6379"
    volumes:
      - myagent_redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: myagent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - myagent_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 8;
       mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
       mc mb -p local/myagent-sources || true;
       mc mb -p local/myagent-assets || true;"
    restart: "no"

  rmqnamesrv:
    image: apache/rocketmq:4.9.7
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rmqbroker:
    image: apache/rocketmq:4.9.7
    container_name: rmqbroker
    depends_on:
      - rmqnamesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
    command: sh mqbroker -n rmqnamesrv:9876

volumes:
  myagent_pg_data:
  myagent_redis_data:
  myagent_minio_data:
